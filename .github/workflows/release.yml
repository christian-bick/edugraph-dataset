name: Release Dataset to HuggingFace

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install host dependencies
        run: npm ci

      - name: Run quality gates
        uses: ./.github/actions/quality-gates
        with:
          spec: ccss

      - name: Generate canonical CCSS dataset
        uses: ./.github/actions/generate-dataset
        with:
          spec: ccss
          concurrency: '8'

      - name: Audit committed VQA cache
        uses: ./.github/actions/audit-release-dataset
        with:
          spec: ccss

      - name: Merge release dataset
        run: npm run merge:dataset

      - name: Generate union coverage report
        run: npm run report:coverage -- --spec=union

      - name: Publish dataset to Hugging Face
        uses: ./.github/actions/publish-dataset
        with:
          release-tag: ${{ github.ref_name }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Trigger coverage explorer deployment from main
        run: gh workflow run deploy.yaml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
