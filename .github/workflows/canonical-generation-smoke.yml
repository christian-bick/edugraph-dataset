name: Canonical Generation Branch Smoke

on:
  push:
    branches:
      - canonical-generation-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical_generation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install host dependencies
        run: npm ci

      - name: Run quality gates
        uses: ./.github/actions/quality-gates
        with:
          spec: test

      - name: Generate canonical test dataset (first pass)
        uses: ./.github/actions/generate-dataset
        with:
          spec: test
          concurrency: '8'

      - name: Record first-pass image hashes
        shell: bash
        run: |
          mkdir -p temp/canonical-ci
          find out/dataset-test -type f -name '*.png' -print0 | sort -z | xargs -0 sha256sum > temp/canonical-ci/first.sha256

      - name: Generate canonical test dataset (second pass)
        uses: ./.github/actions/generate-dataset
        with:
          spec: test
          concurrency: '8'

      - name: Verify deterministic image hashes
        shell: bash
        run: |
          find out/dataset-test -type f -name '*.png' -print0 | sort -z | xargs -0 sha256sum > temp/canonical-ci/second.sha256
          diff -u temp/canonical-ci/first.sha256 temp/canonical-ci/second.sha256

      - name: Exercise strict audit against the known migration gap
        id: audit
        continue-on-error: true
        uses: ./.github/actions/audit-release-dataset
        with:
          spec: test

      - name: Verify strict audit blocks an incomplete cache
        shell: bash
        run: test "${{ steps.audit.outcome }}" = failure

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: canonical-generation-smoke
          if-no-files-found: warn
          path: |
            temp/canonical-ci/
            out/dataset-test/manifest.json
