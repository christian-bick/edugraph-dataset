name: Validate Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        uses: ./.github/actions/quality-gates
        with:
          spec: ccss

      - name: Prepare immutable coverage core
        uses: ./.github/actions/coverage-core
        with:
          source-ref: main
          source-sha: ${{ github.sha }}

      - name: Generate validation coverage projection
        run: >-
          npm run generate:standards-explorer --
          --output-dir=temp/coverage-validation
          --channel=preview
          --source-ref=main
          --source-sha="${{ github.sha }}"

      - name: Validate coverage projection and core
        run: npm run validate:coverage -- --coverage-dir=temp/coverage-validation

  deploy_coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yaml
    with:
      preview_sha: ${{ github.sha }}
